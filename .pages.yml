media:
  input: public/media
  output: /media
  rename: safe
  categories: [image, video]

content:
  - name: identity
    label: Identity & Contact
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: short_name, label: Short name, type: string, required: true }
      - { name: role_en, label: Professional role — English, type: string, required: true }
      - { name: role_id, label: Professional role — Indonesian, type: string, required: true }
      - { name: email, label: Email, type: string, required: true }
      - { name: phone_display, label: Phone display, type: string, required: true }
      - { name: phone_whatsapp, label: WhatsApp number with country code, type: string, required: true }
      - { name: location_en, label: Location — English, type: string }
      - { name: location_id, label: Location — Indonesian, type: string }
      - { name: profile_image, label: Main portrait, type: image, required: true }
      - { name: cv_path, label: CV download path, type: string }
      - { name: instagram_personal, label: Instagram personal, type: string }
      - { name: instagram_fluentic, label: Instagram Fluentic, type: string }
      - { name: linkedin, label: LinkedIn, type: string }
      - { name: google_scholar, label: Google Scholar, type: string }
      - { name: sinta, label: SINTA, type: string }
      - { name: orcid, label: ORCID, type: string }
      - { name: youtube, label: YouTube, type: string }

  - name: homepage
    label: Homepage Text
    type: file
    path: src/data/home.json
    format: json
    fields:
      - { name: eyebrow_en, label: Eyebrow — English, type: string }
      - { name: eyebrow_id, label: Eyebrow — Indonesian, type: string }
      - { name: headline_en, label: Main headline — English, type: text }
      - { name: headline_id, label: Main headline — Indonesian, type: text }
      - { name: intro_en, label: Hero introduction — English, type: text }
      - { name: intro_id, label: Hero introduction — Indonesian, type: text }
      - { name: quote_en, label: Personal quote — English, type: text }
      - { name: quote_id, label: Personal quote — Indonesian, type: text }
      - { name: section_title_en, label: Story title — English, type: text }
      - { name: section_title_id, label: Story title — Indonesian, type: text }
      - { name: section_text_en, label: Story paragraph — English, type: text }
      - { name: section_text_id, label: Story paragraph — Indonesian, type: text }
      - { name: achievement_title_en, label: Achievement title — English, type: text }
      - { name: achievement_title_id, label: Achievement title — Indonesian, type: text }
      - { name: achievement_text_en, label: Achievement paragraph — English, type: text }
      - { name: achievement_text_id, label: Achievement paragraph — Indonesian, type: text }
      - { name: fluentic_title_en, label: Fluentic title — English, type: text }
      - { name: fluentic_title_id, label: Fluentic title — Indonesian, type: text }
      - { name: fluentic_text_en, label: Fluentic paragraph — English, type: text }
      - { name: fluentic_text_id, label: Fluentic paragraph — Indonesian, type: text }

  - name: gallery
    label: Photo Gallery
    type: file
    path: src/data/gallery.json
    format: json
    list: true
    fields:
      - { name: title_en, label: Title — English, type: string, required: true }
      - { name: title_id, label: Title — Indonesian, type: string, required: true }
      - { name: year, label: Date or year, type: string }
      - { name: location, label: Location, type: string }
      - { name: role_en, label: Role — English, type: string }
      - { name: role_id, label: Role — Indonesian, type: string }
      - { name: caption_en, label: Caption — English, type: text }
      - { name: caption_id, label: Caption — Indonesian, type: text }
      - { name: alt_en, label: Image description — English, type: text }
      - { name: alt_id, label: Image description — Indonesian, type: text }
      - { name: image, label: Photo, type: image, required: true }
      - { name: featured, label: Show on homepage, type: boolean, default: false }
      - { name: published, label: Publish, type: boolean, default: true }

  - name: videos
    label: Videos
    type: file
    path: src/data/videos.json
    format: json
    list: true
    fields:
