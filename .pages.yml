      - { name: duration, label: Duration, type: string }
      - { name: caption_en, label: Caption — English, type: text }
      - { name: caption_id, label: Caption — Indonesian, type: text }
      - { name: thumbnail, label: Thumbnail, type: image }
      - { name: youtube_url, label: YouTube URL, type: string }
      - { name: video_file, label: Uploaded video, type: file }
      - { name: published, label: Publish, type: boolean, default: false }

